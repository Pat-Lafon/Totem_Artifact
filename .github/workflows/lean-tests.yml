name: Lean tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: "Tests",     cmd: "lake test" }
          - { name: "Scenarios", cmd: "lake build Scenarios" }
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Z3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends z3
          z3 --version

      - name: Install Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: false

      - name: ${{ matrix.target.name }}
        run: ${{ matrix.target.cmd }}
